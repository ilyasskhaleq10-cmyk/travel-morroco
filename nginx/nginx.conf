# Ejemplo de servidor para el VPS. Copiar a /etc/nginx/sites-available/,
# ajustar server_name y la ruta de root, y enlazar en sites-enabled.
#
# El sitio es estático: `npm run build` deja todo en dist/ y nginx lo sirve
# directamente. No hace falta Node corriendo en producción.

server {
    listen 80;
    listen [::]:80;
    server_name ejemplo.com www.ejemplo.com;

    root /var/www/viajes-marruecos;
    index index.html;
    include /etc/nginx/mime.types;
    charset utf-8;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Los assets con hash en el nombre no cambian nunca: caché larga.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El build usa trailingSlash: false, así que /en/ redirige a /en.
    location ~ ^(?<path_no_slash>/.+)/$ {
        return 301 $path_no_slash$is_args$args;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
